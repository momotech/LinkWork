spring:
  application:
    name: linkwork
  datasource:
    url: ${LINKWORK_DB_URL:jdbc:mysql://127.0.0.1:3306/linkwork?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=utf8}
    username: ${LINKWORK_DB_USERNAME:linkwork}
    password: ${LINKWORK_DB_PASSWORD:changeit}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 30000
      connection-timeout: 30000

server:
  port: ${SERVER_PORT:8080}

mybatis-plus:
  mapper-locations: classpath:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: isDeleted
      logic-delete-value: true
      logic-not-delete-value: false

linkwork:
  api:
    cors:
      allowed-origins: ${LINKWORK_ALLOWED_ORIGINS:*}
  build:
    enabled: ${LINKWORK_BUILD_ENABLED:true}
    push-enabled: ${LINKWORK_BUILD_PUSH_ENABLED:true}
    local-load-enabled: ${LINKWORK_BUILD_LOCAL_LOAD_ENABLED:false}
    cleanup-local-after-push: ${LINKWORK_BUILD_CLEAN_LOCAL:true}
    build-timeout-seconds: ${LINKWORK_BUILD_TIMEOUT_SECONDS:1800}
    local-load-timeout-seconds: ${LINKWORK_BUILD_LOCAL_LOAD_TIMEOUT_SECONDS:900}
    kind-cluster-name: ${LINKWORK_BUILD_KIND_CLUSTER_NAME:kind}
    build-context-dir: ${LINKWORK_BUILD_CONTEXT_DIR:/tmp/linkwork-build}
    build-script-path: ${LINKWORK_BUILD_SCRIPT_PATH:}
    default-agent-base-image: ${LINKWORK_BUILD_DEFAULT_AGENT_BASE_IMAGE:ghcr.io/linkwork/agent-base:latest}
    registry: ${LINKWORK_BUILD_REGISTRY:registry.example.com/linkwork}
    registry-username: ${LINKWORK_BUILD_REGISTRY_USERNAME:}
    registry-password: ${LINKWORK_BUILD_REGISTRY_PASSWORD:}
    image-pull-secret: ${LINKWORK_BUILD_IMAGE_PULL_SECRET:linkwork-registry-secret}
    docker-host: ${DOCKER_HOST:}
    entrypoint-script: ${LINKWORK_BUILD_ENTRYPOINT:/opt/agent/start-single.sh}
    sdk-repo-url: ${LINKWORK_BUILD_SDK_REPO_URL:}
    sdk-repo-branch: ${LINKWORK_BUILD_SDK_REPO_BRANCH:main}
    sdk-repo-username: ${LINKWORK_BUILD_SDK_REPO_USERNAME:}
    sdk-repo-password: ${LINKWORK_BUILD_SDK_REPO_PASSWORD:}
  agent:
    mcp:
      enabled: ${LINKWORK_AGENT_MCP_ENABLED:true}
      mode: ${LINKWORK_AGENT_MCP_MODE:gateway}
      gateway:
        proxy-base-url: ${LINKWORK_AGENT_MCP_GATEWAY_PROXY_BASE_URL:http://linkwork-mcp-gateway.linkwork-mcp-gateway.svc.cluster.local:9080}
        agent-base-url: ${LINKWORK_AGENT_MCP_GATEWAY_AGENT_BASE_URL:http://linkwork-mcp-gateway.linkwork-mcp-gateway.svc.cluster.local:9080}
      client:
        connect-timeout-ms: ${LINKWORK_AGENT_MCP_CONNECT_TIMEOUT_MS:3000}
        read-timeout-ms: ${LINKWORK_AGENT_MCP_READ_TIMEOUT_MS:10000}
    sandbox:
      provider: ${LINKWORK_SANDBOX_PROVIDER:k8s-volcano}
      k8s:
        kubeconfig-path: ${KUBECONFIG_PATH:${user.home}/.kube/config}
        namespace: ${K8S_NAMESPACE:linkwork-dev}
        scheduler-name: ${K8S_SCHEDULER_NAME:default-scheduler}
        queue-name: ${K8S_QUEUE_NAME:default}
        create-pod-group: ${K8S_CREATE_POD_GROUP:false}
        default-agent-image: ${LINKWORK_K8S_DEFAULT_AGENT_IMAGE:ghcr.io/linkwork/agent-base:latest}
        default-runner-image: ${LINKWORK_K8S_DEFAULT_RUNNER_IMAGE:ghcr.io/linkwork/runner:latest}
        default-image-pull-policy: ${LINKWORK_K8S_IMAGE_PULL_POLICY:IfNotPresent}
        auto-create-image-pull-secret: ${LINKWORK_K8S_AUTO_CREATE_IMAGE_PULL_SECRET:true}
        registry: ${LINKWORK_BUILD_REGISTRY:registry.example.com/linkwork}
        registry-username: ${LINKWORK_BUILD_REGISTRY_USERNAME:}
        registry-password: ${LINKWORK_BUILD_REGISTRY_PASSWORD:}
  skill:
    enabled: true
    provider: multi
    retry-times: 2
    retry-backoff-ms: 200
    cache-ttl-ms: 10000
    github:
      api-url: ${LINKWORK_GITHUB_API_URL:https://api.github.com}
      token: ${LINKWORK_GITHUB_TOKEN:}
      owner: ${LINKWORK_GITHUB_OWNER:}
      repo: ${LINKWORK_GITHUB_REPO:}
      branch: ${LINKWORK_GITHUB_BRANCH:main}
      root-path: ${LINKWORK_GITHUB_ROOT_PATH:skills}
    gitlab:
      url: ${LINKWORK_GITLAB_URL:}
      repo-url: ${LINKWORK_GITLAB_REPO_URL:}
      token: ${LINKWORK_GITLAB_TOKEN:}
      deploy-token: ${LINKWORK_GITLAB_DEPLOY_TOKEN:}
      project-id: ${LINKWORK_GITLAB_PROJECT_ID:}
      branch: ${LINKWORK_GITLAB_BRANCH:main}
      root-path: ${LINKWORK_GITLAB_ROOT_PATH:skills}
    providers:
      default-provider: gitlab
      github-enabled: false
      gitlab-enabled: false

momo:
  agent:
    sandbox:
      provider: ${LINKWORK_SANDBOX_PROVIDER:k8s-volcano}
      k8s:
        kubeconfig-path: ${KUBECONFIG_PATH:${user.home}/.kube/config}
        namespace: ${K8S_NAMESPACE:linkwork-dev}
        scheduler-name: ${K8S_SCHEDULER_NAME:default-scheduler}
        queue-name: ${K8S_QUEUE_NAME:default}
        create-pod-group: ${K8S_CREATE_POD_GROUP:false}
        default-agent-image: ${LINKWORK_K8S_DEFAULT_AGENT_IMAGE:ghcr.io/linkwork/agent-base:latest}
        default-runner-image: ${LINKWORK_K8S_DEFAULT_RUNNER_IMAGE:ghcr.io/linkwork/runner:latest}
        default-image-pull-policy: ${LINKWORK_K8S_IMAGE_PULL_POLICY:IfNotPresent}
        auto-create-image-pull-secret: ${LINKWORK_K8S_AUTO_CREATE_IMAGE_PULL_SECRET:true}
        registry: ${LINKWORK_BUILD_REGISTRY:registry.example.com/linkwork}
        registry-username: ${LINKWORK_BUILD_REGISTRY_USERNAME:}
        registry-password: ${LINKWORK_BUILD_REGISTRY_PASSWORD:}
